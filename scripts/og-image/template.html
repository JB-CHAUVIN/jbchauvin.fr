<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url(../../public/fonts/bricolage-grotesque-latin.woff2) format('woff2-variations');
    font-weight: 400 800;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #111827;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    width: 1200px; height: 630px;
    padding: 72px 76px 66px;
    display: flex; flex-direction: column;
    position: relative;
  }
  /* the site's single interactive colour (--accent), used as a top rule */
  .frame::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 6px; background: #1d4ed8;
  }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 48px; }

  .name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 74px; line-height: 1.02;
    letter-spacing: -0.028em; color: #111827;
  }
  .rule { width: 96px; height: 3px; background: #111827; margin: 26px 0 24px; }

  .role { font-size: 31px; line-height: 1.35; color: #374151; font-weight: 500; }
  .role strong { color: #111827; font-weight: 600; }
  .place { font-size: 24px; color: #6b7280; margin-top: 10px; }

  /* profile.jpg is a square avatar already framed on its navy disc — just clip it. */
  .photo {
    width: 168px; height: 168px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }

  .stats {
    margin-top: auto;
    display: flex; align-items: baseline; gap: 26px;
    font-size: 24px; color: #6b7280;
  }
  .stats b {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 34px; color: #111827;
    font-variant-numeric: tabular-nums; margin-right: 9px;
  }
  .dot { color: #d1d5db; }

  .footer {
    margin-top: 34px; padding-top: 30px;
    border-top: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
  }
  .companies { display: flex; align-items: center; gap: 26px; }
  .companies img { display: block; }
  .logo-infobam { height: 40px; }
  .logo-gbh { height: 37px; }
  .sep { width: 1px; height: 34px; background: #e5e7eb; }
  .cur { font-size: 20px; color: #6b7280; line-height: 1.3; }
  .cur b { display: block; color: #111827; font-weight: 600; font-size: 21px; }

  .url {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600; font-size: 27px; color: #1d4ed8;
    letter-spacing: -0.01em; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div>
        <div class="name">Jean-Baptiste<br>Chauvin</div>
        <div class="rule"></div>
        <div class="role"><strong>{{ROLE}}</strong> &middot; React Native &amp; Full-Stack</div>
        <div class="place">Paris, France</div>
      </div>
      <div class="photo"><img src="../../public/images/profile.jpg" alt=""></div>
    </div>

    <div class="stats">
      <span><b>{{YEARS_N}}</b>{{YEARS}}</span>
      <span class="dot">&middot;</span>
      <span><b>{{PRODUCTS_N}}</b>{{PRODUCTS}}</span>
      <span class="dot">&middot;</span>
      <span><b>{{USERS_N}}</b>{{USERS}}</span>
    </div>

    <div class="footer">
      <div class="companies">
        <img class="logo-infobam" src="../../public/images/companies/infobam.png" alt="Infobam">
        <div class="sep"></div>
        <img class="logo-gbh" src="../../public/images/companies/gbh.svg" alt="GBH">
        <div class="sep"></div>
        <div class="cur"><b>{{CURRENT}}</b>{{CLIENT}}</div>
      </div>
      <div class="url">jbchauvin.fr</div>
    </div>
  </div>
</body>
</html>
